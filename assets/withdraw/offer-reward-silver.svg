<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Background Canvas: Matches inst_silver.svg squircle exactly -->
  <rect width="64" height="64" rx="14" fill="#05592F"/>
  
  <!-- Accent Sparkles (Positioned identically to maintain visual rhythm) -->
  <!-- Left Small Sparkle -->
  <path d="M12,29 C14,29 14,28 14,26 C14,28 14,29 16,29 C14,29 14,30 14,32 C14,30 14,29 12,29 Z" fill="#E5E5E5"/>
  <!-- Top Center Medium Sparkle -->
  <path d="M27,15 C30,15 30,13 30,10 C30,13 30,15 33,15 C30,15 30,17 30,20 C30,17 30,15 27,15 Z" fill="#E5E5E5"/>
  <!-- Right Large Sparkle -->
  <path d="M43,19 C47,19 47,17 47,13 C47,17 47,19 51,19 C47,19 47,21 47,25 C47,21 47,19 43,19 Z" fill="#E5E5E5"/>

  <!-- Core Reward Graphic: Stylized Gift Box with matching perspective lines -->
  <g transform="translate(0, 2)">
    <!-- Main Box Body (Light Gray) -->
    <path d="M20,36 L44,36 L44,50 C44,52 42,53 40,53 L24,53 C22,53 20,52 20,50 Z" fill="#E5E5E5"/>
    
    <!-- Box Lid (Pure White for contrast/dimension) -->
    <path d="M18,31 L46,31 L46,36 L18,36 Z" fill="#FFFFFF"/>
    
    <!-- Dark Inset Line Details (Replicating the blocky illustration style) -->
    <path d="M18,36 L46,36 M20,43 L44,43 M32,31 L32,53" stroke="#05592F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Isometric Ribbon Bow -->
    <path d="M32,31 C29,26 25,28 28,31 C31,31 32,31 32,31 Z" fill="#FFFFFF"/>
    <path d="M32,31 C35,26 39,28 36,31 C33,31 32,31 32,31 Z" fill="#FFFFFF"/>
    <path d="M28,31 C29,29 31,30 32,31 C33,30 35,29 36,31" stroke="#05592F" stroke-width="1.2" fill="none"/>
  </g>
</svg>
